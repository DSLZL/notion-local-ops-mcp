services:
  notion-local-ops-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: notion-local-ops-mcp:local
    container_name: notion-local-ops-mcp
    environment:
      NOTION_LOCAL_OPS_AUTH_TOKEN: change-me
      NOTION_LOCAL_OPS_WORKSPACE_ROOT: /app/CTF
      NOTION_LOCAL_OPS_STATE_DIR: /tmp/notion-local-ops-mcp
      NOTION_LOCAL_OPS_HOST: 0.0.0.0
      NOTION_LOCAL_OPS_PORT: "8766"
      HOME: /tmp
    ports:
      - "8766:8766"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
